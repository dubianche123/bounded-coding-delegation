<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
  <title id="title">Bounded Coding Delegation C4 runtime flow</title>
  <desc id="desc">A C4-style runtime architecture diagram showing a parent orchestrator delegating one bounded task to a deterministic Python helper. The helper runs local workspace operations, calls model-backed CLIs, writes handoff artifacts, emits stderr progress, and returns one compact stdout JSON brief.</desc>
  <defs>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #fbfaf7; }
      .cluster { fill: #ffffff; stroke: #d4d4d8; stroke-width: 2; }
      .cluster-title { fill: #52525b; font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .cluster-sub { fill: #71717a; font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .node { fill: #ffffff; stroke: #18181b; stroke-width: 2.2; }
      .node-helper { fill: #fff7ed; stroke: #b45309; stroke-width: 2.2; }
      .node-artifact { fill: #f0fdf4; stroke: #15803d; stroke-width: 2.2; }
      .node-model { fill: #fff1f2; stroke: #dc2626; stroke-width: 2.2; }
      .node-heartbeat { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; }
      .title-text { fill: #111827; font: 800 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .title-detail { fill: #111827; font: 700 23px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .subtitle { fill: #52525b; font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .node-title { fill: #111827; font: 800 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .node-body { fill: #3f3f46; font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .node-small { fill: #52525b; font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .line-black { fill: none; stroke: #111827; stroke-width: 3; marker-end: url(#arrow-black); stroke-linecap: round; stroke-linejoin: round; }
      .line-red { fill: none; stroke: #dc2626; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow-red); stroke-linecap: round; stroke-linejoin: round; }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); stroke-linecap: round; stroke-linejoin: round; }
      .line-muted { fill: none; stroke: #71717a; stroke-width: 2.4; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round; }
      .line-label { fill: #18181b; font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .red-label { fill: #b91c1c; font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .blue-label { fill: #1d4ed8; font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .legend { fill: #3f3f46; font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .legend-strong { fill: #18181b; font: 800 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="1050"/>

  <text class="title-text" x="60" y="64">Bounded Coding Delegation</text>
  <text class="title-detail" x="60" y="98">C4 runtime flow for bounded local AI coding delegation</text>
  <text class="subtitle" x="60" y="130">Control, model calls, and handoff artifacts are split into separate lanes so stdout stays parseable and escalation stays outside the worker.</text>

  <rect class="cluster" x="50" y="165" width="300" height="770" rx="18"/>
  <text class="cluster-title" x="78" y="204">Parent Orchestrator</text>
  <text class="cluster-sub" x="78" y="231">plans once, then reacts to brief JSON</text>

  <rect class="cluster" x="390" y="165" width="420" height="520" rx="18"/>
  <text class="cluster-title" x="418" y="204">Deterministic Helper Boundary</text>
  <text class="cluster-sub" x="418" y="231">stateless Python worker with hard limits</text>

  <rect class="cluster" x="850" y="165" width="500" height="520" rx="18"/>
  <text class="cluster-title" x="878" y="204">Model-Backed CLIs</text>
  <text class="cluster-sub" x="878" y="231">bounded implementation and review calls</text>

  <rect class="cluster" x="390" y="720" width="960" height="215" rx="18"/>
  <text class="cluster-title" x="418" y="759">Local Workspace and Handoff</text>

  <rect class="node" x="90" y="255" width="220" height="112" rx="14"/>
  <text class="node-title" x="200" y="294">Hermes Skill</text>
  <text class="node-body" x="200" y="322">or portable caller</text>
  <text class="node-small" x="200" y="346">Codex CLI / Gemini CLI wrapper</text>

  <rect class="node-heartbeat" x="90" y="465" width="220" height="96" rx="14"/>
  <text class="node-title" x="200" y="503">Live Terminal</text>
  <text class="node-body" x="200" y="531">stderr progress stream</text>
  <text class="node-small" x="200" y="552">human-visible only</text>

  <rect class="node" x="90" y="690" width="220" height="120" rx="14"/>
  <text class="node-title" x="200" y="731">Orchestrator Wake-Up</text>
  <text class="node-body" x="200" y="759">reads compact JSON</text>
  <text class="node-small" x="200" y="782">apply, retry, or escalate</text>

  <rect class="node-helper" x="435" y="250" width="330" height="94" rx="16"/>
  <text class="node-title" x="600" y="288">Request Adapter</text>
  <text class="node-body" x="600" y="316">normalize task and lock workspace</text>
  <text class="node-small" x="600" y="336">resolve fast / safe policy</text>

  <rect class="node-helper" x="435" y="390" width="330" height="150" rx="16"/>
  <text class="node-title" x="600" y="430">Bounded Execution Loop</text>
  <text class="node-body" x="600" y="460">implementation, tests, review</text>
  <text class="node-body" x="600" y="483">fixup until max attempts</text>
  <text class="node-small" x="600" y="512">fail fast: needs_escalation</text>

  <rect class="node-heartbeat" x="435" y="590" width="330" height="86" rx="14"/>
  <text class="node-title" x="600" y="626">Progress Heartbeat</text>
  <text class="node-body" x="600" y="651">stderr only, never stdout</text>

  <rect class="node-model" x="1010" y="235" width="250" height="92" rx="14"/>
  <text class="node-title" x="1135" y="272">Gemini Flash</text>
  <text class="node-body" x="1135" y="300">implementation executor</text>
  <text class="node-small" x="1135" y="320">gemini-3-flash-preview</text>

  <rect class="node-model" x="1010" y="370" width="250" height="92" rx="14"/>
  <text class="node-title" x="1135" y="407">Flash-Lite Review</text>
  <text class="node-body" x="1135" y="435">cheap step review</text>
  <text class="node-small" x="1135" y="455">asks Pro only on risk</text>

  <rect class="node-model" x="1010" y="505" width="250" height="92" rx="14"/>
  <text class="node-title" x="1135" y="542">Gemini Pro</text>
  <text class="node-body" x="1135" y="570">safe final review</text>
  <text class="node-small" x="1135" y="590">external escalation decision</text>

  <rect class="node-artifact" x="435" y="800" width="220" height="95" rx="14"/>
  <text class="node-title" x="545" y="838">Repo Workspace</text>
  <text class="node-body" x="545" y="866">direct / worktree / copy</text>
  <text class="node-small" x="545" y="887">git diff + tests</text>

  <rect class="node-artifact" x="715" y="790" width="280" height="125" rx="14"/>
  <text class="node-title" x="855" y="830">Run Artifacts</text>
  <text class="node-body" x="855" y="859">model stdout / stderr logs</text>
  <text class="node-body" x="855" y="882">review outputs and tests</text>
  <text class="node-small" x="855" y="903">.hermes/delegate-runs</text>

  <rect class="node-artifact" x="1060" y="800" width="235" height="95" rx="14"/>
  <text class="node-title" x="1177.5" y="838">Two-Tier Handoff</text>
  <text class="node-body" x="1177.5" y="866">brief / summary / handoff</text>
  <text class="node-small" x="1177.5" y="887">details read on demand</text>

  <path class="line-black" d="M 310 311 L 435 311"/>
  <text class="line-label" x="372.5" y="299">request JSON</text>

  <path class="line-black" d="M 600 344 L 600 390"/>
  <text class="line-label" x="665" y="371">normalized task</text>

  <path class="line-red" d="M 765 430 L 880 430 L 880 281 L 1010 281"/>
  <text class="red-label" x="820" y="418">implementation</text>

  <path class="line-red" d="M 765 470 L 915 470 L 915 416 L 1010 416"/>
  <text class="red-label" x="840" y="458">step review</text>

  <path class="line-red" d="M 765 510 L 950 510 L 950 551 L 1010 551"/>
  <text class="red-label" x="857.5" y="498">final review</text>

  <path class="line-blue" d="M 600 540 L 600 590"/>
  <text class="blue-label" x="655" y="570">heartbeat events</text>

  <path class="line-blue" d="M 435 633 L 365 633 L 365 513 L 310 513"/>
  <text class="blue-label" x="395" y="621">stderr heartbeat</text>

  <path class="line-black" d="M 765 518 L 820 518 L 820 705 L 405 705 L 405 848 L 435 848"/>
  <text class="line-label" x="612.5" y="693">workspace + tests</text>

  <path class="line-black" d="M 655 848 L 715 848"/>
  <text class="line-label" x="685" y="836">logs</text>

  <path class="line-black" d="M 995 848 L 1060 848"/>
  <text class="line-label" x="1027.5" y="836">summary</text>

  <path class="line-black" d="M 1177.5 895 L 1177.5 975 L 200 975 L 200 810"/>
  <text class="line-label" x="688.75" y="963">stdout JSON brief</text>

  <path class="line-muted" d="M 200 367 L 200 465"/>
  <path class="line-muted" d="M 200 561 L 200 690"/>

  <rect x="50" y="1000" width="1300" height="40" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <line x1="86" y1="1020" x2="156" y2="1020" class="line-black"/>
  <text class="legend-strong" x="178" y="1026">Control</text>
  <text class="legend" x="250" y="1026">bounded worker state and handoff JSON</text>
  <line x1="560" y1="1020" x2="630" y2="1020" class="line-red"/>
  <text class="legend-strong" x="652" y="1026">Model calls</text>
  <text class="legend" x="762" y="1026">executor and reviewers</text>
  <line x1="1010" y1="1020" x2="1080" y2="1020" class="line-blue"/>
  <text class="legend-strong" x="1102" y="1026">Observability</text>
  <text class="legend" x="1232" y="1026">stderr only</text>
</svg>
